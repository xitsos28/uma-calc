<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>경기장 선택</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

  <div class="max-w-md mx-auto bg-white min-h-screen shadow-2xl flex flex-col">

    <header class="bg-white p-4 shadow-sm sticky top-0 z-10 border-b border-gray-100">
      <h1 class="text-lg font-black text-gray-800 text-center">🐎 경기장 선택</h1>
    </header>

    <div class="flex-1 flex flex-col gap-6 p-5">

      <!-- 첫 번째 경기장: 교토 3200m -->
      <div class="bg-white border border-gray-200 rounded-2xl shadow-sm overflow-hidden">
        <div class="bg-blue-50 border-b border-blue-100 px-4 py-3">
          <p class="text-sm font-black text-blue-800 text-center tracking-wide">🏟️ 교토 3200m</p>
        </div>
        <div class="grid grid-cols-4 gap-2 p-4">
          <a href="교토3200도주.html"
             class="flex flex-col items-center justify-center gap-1 bg-blue-500 hover:bg-blue-600 active:bg-blue-700 text-white rounded-xl py-3 px-1 transition-colors cursor-pointer text-center shadow-sm">
            <span class="text-lg">🚀</span>
            <span class="text-xs font-black">도주</span>
          </a>
          <a href="교토3200선행.html"
             class="flex flex-col items-center justify-center gap-1 bg-green-500 hover:bg-green-600 active:bg-green-700 text-white rounded-xl py-3 px-1 transition-colors cursor-pointer text-center shadow-sm">
            <span class="text-lg">🏃</span>
            <span class="text-xs font-black">선행</span>
          </a>
          <a href="교토3200선입.html"
             class="flex flex-col items-center justify-center gap-1 bg-yellow-500 hover:bg-yellow-600 active:bg-yellow-700 text-white rounded-xl py-3 px-1 transition-colors cursor-pointer text-center shadow-sm">
            <span class="text-lg">🎯</span>
            <span class="text-xs font-black">선입</span>
          </a>
          <a href="교토3200추입.html"
             class="flex flex-col items-center justify-center gap-1 bg-red-500 hover:bg-red-600 active:bg-red-700 text-white rounded-xl py-3 px-1 transition-colors cursor-pointer text-center shadow-sm">
            <span class="text-lg">⚡</span>
            <span class="text-xs font-black">추입</span>
          </a>
        </div>
      </div>

      <!-- 두 번째 경기장: 한신 1600m -->
      <div class="bg-white border border-gray-200 rounded-2xl shadow-sm overflow-hidden">
        <div class="bg-purple-50 border-b border-purple-100 px-4 py-3">
          <p class="text-sm font-black text-purple-800 text-center tracking-wide">🏟️ 한신 1600m</p>
        </div>
        <div class="grid grid-cols-4 gap-2 p-4">
          <a href="한신1600도주.html"
             class="flex flex-col items-center justify-center gap-1 bg-blue-500 hover:bg-blue-600 active:bg-blue-700 text-white rounded-xl py-3 px-1 transition-colors cursor-pointer text-center shadow-sm">
            <span class="text-lg">🚀</span>
            <span class="text-xs font-black">도주</span>
          </a>
          <a href="한신1600선행.html"
             class="flex flex-col items-center justify-center gap-1 bg-green-500 hover:bg-green-600 active:bg-green-700 text-white rounded-xl py-3 px-1 transition-colors cursor-pointer text-center shadow-sm">
            <span class="text-lg">🏃</span>
            <span class="text-xs font-black">선행</span>
          </a>
          <a href="한신1600선입.html"
             class="flex flex-col items-center justify-center gap-1 bg-yellow-500 hover:bg-yellow-600 active:bg-yellow-700 text-white rounded-xl py-3 px-1 transition-colors cursor-pointer text-center shadow-sm">
            <span class="text-lg">🎯</span>
            <span class="text-xs font-black">선입</span>
          </a>
          <a href="한신1600추입.html"
             class="flex flex-col items-center justify-center gap-1 bg-red-500 hover:bg-red-600 active:bg-red-700 text-white rounded-xl py-3 px-1 transition-colors cursor-pointer text-center shadow-sm">
            <span class="text-lg">⚡</span>
            <span class="text-xs font-black">추입</span>
          </a>
        </div>
      </div>

      <p class="text-center text-xs text-gray-400 font-semibold">경기장과 각질을 선택하세요</p>

    </div>



  </div>

</body>
</html>
