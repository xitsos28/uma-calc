<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우마무스메 경기장 스킬 가성비 계산기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .page-transition { transition: transform 0.3s ease-in-out; }
  </style>
</head>
<body class="bg-gray-100 font-sans">

  <div class="max-w-md mx-auto bg-white min-h-screen shadow-2xl flex flex-col relative overflow-hidden">
    
    <div id="page-1" class="flex-1 flex flex-col pb-4">
      <header class="bg-white p-3 shadow-sm sticky top-0 z-10 border-b border-gray-100">
        <div class="flex justify-between items-center mb-2">
          <h1 class="text-lg font-black text-gray-800">🐎 경기장 가성비 계산기</h1>
          <span id="selected-count-badge" class="bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full text-xs font-black">0개 고름</span>
        </div>

        <div class="mb-2 p-2.5 bg-green-50 border border-green-200 rounded-lg text-center">
          <p class="text-xs font-black text-green-800">✅ 도쿄 2400m 도주 스킬 데이터셋</p>
          <p class="text-[12px] text-gray-500 font-semibold mt-0.5">우마무스메 서클 Gray</p>
        </div>

        <div class="grid grid-cols-3 gap-1.5 mb-2">
          <button onclick="openBottomSheet()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-2 rounded-xl shadow-md flex flex-col justify-center items-center text-[10px] transition-all">
            <span>🛒 선택 완료!</span>
            <span class="text-[9px] font-black bg-blue-800/40 px-1 py-0.5 rounded mt-0.5">다음 →</span>
          </button>
          <button id="btn-masin-sort" onclick="toggleMasinSort()" class="bg-violet-50 hover:bg-violet-100 border border-violet-300 text-violet-700 font-bold py-2 px-2 rounded-xl shadow-sm flex flex-col justify-center items-center text-[10px] transition-all">
            <span id="btn-masin-sort-label">🔢 마신 이득<br>순서로 정렬</span>
          </button>
          <button onclick="resetAllSelections()" class="bg-red-50 hover:bg-red-100 border border-red-200 text-red-600 font-bold py-2 px-1 rounded-xl shadow-sm flex flex-col justify-center items-center text-[11px] transition-all">
            <span>🔄 리셋</span>
          </button>
        </div>
        
        <div id="search-bar-container" class="relative mt-1">
          <input type="text" id="skill-search-input" oninput="handleSearchQuery(this.value)" placeholder="🔍 스킬 이름 또는 종류를 입력하세요" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 font-semibold">
          <button onclick="clearSearch()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 font-bold text-xs">✕</button>
        </div>
      </header>

      <main id="skill-list-container" class="flex-1 p-2 space-y-1.5 overflow-y-auto no-scrollbar max-h-[calc(100vh-165px)]">
      </main>
    </div>

    <div id="bottom-sheet" class="absolute inset-0 bg-gray-900 text-white z-20 page-transition transform translate-y-full flex flex-col">
      
      <div class="p-3 border-b border-gray-800 bg-gray-900 sticky top-0 z-30 space-y-2.5">
        <div class="flex justify-between items-center">
          <h2 id="sheet-title" class="text-base font-black text-gray-100">🛠️ 1단계: 힌트 및 pt 사전 세팅</h2>
          <button onclick="closeBottomSheet()" class="text-gray-400 hover:text-white font-bold text-xs bg-gray-800 px-2.5 py-1 rounded-lg">← 추가 선택</button>
        </div>

        <div class="grid grid-cols-2 gap-3 bg-gray-800 p-2.5 rounded-xl border border-gray-700">
          <div>
            <label class="block text-[10px] text-gray-400 font-bold mb-0.5">내 보유 SP 입력</label>
            <input type="number" id="input-user-sp" value="1200" oninput="processCalculation()" class="w-full bg-gray-700 text-white font-extrabold px-2.5 py-1 rounded-lg border border-gray-600 focus:outline-none focus:border-blue-500 text-xs">
          </div>
          <div class="text-right flex flex-col justify-center">
            <span class="text-[10px] text-gray-400 font-bold">배우고 남은 예상 SP</span>
            <span id="text-remaining-sp" class="text-sm font-black text-green-400">1200 pt</span>
          </div>
        </div>

        <div>
          <button id="btn-savant" onclick="toggleSavant()" class="w-full bg-gray-700 hover:bg-gray-600 border border-gray-600 text-gray-300 font-bold py-2 rounded-xl shadow-lg flex justify-center items-center gap-2 text-xs transition-all">
            <span id="btn-savant-label">💼 수완가 적용하기 (비활성)</span>
          </button>
        </div>
        <div>
          <button id="btn-toggle-sort" onclick="toggleSortMode()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded-xl shadow-lg flex justify-center items-center gap-2 text-xs transition-all">
            <span>📊 최종 가성비 순위 정렬하기</span>
          </button>
        </div>
      </div>

      <div id="calculation-container" class="flex-1 overflow-y-auto p-3 space-y-1.5 pb-8 no-scrollbar"></div>
    </div>

  </div>

  <script>
    // ==========================================
    // ⚙ 외부 JSON 데이터베이스 연결
    // ==========================================
    // 같은 폴더에 있는 data/margin.json을 불러옵니다.
    // 현재 페이지는 도쿄 2400m / 도주 데이터만 사용합니다.
    const DATABASE_URL = "./data/margin.json";
    const DATABASE_COURSE_ID = "tokyo_2400";
    const DATABASE_RUNNING_STYLE = "도주";

    let appSkills = [];
    let searchQuery = ""; 
    let isSortMode = false;
    let isSavant = false;
    let isMasinSortMode = false;

    window.addEventListener('DOMContentLoaded', async () => {
      const container = document.getElementById('skill-list-container');

      try {
        if (container) {
          container.innerHTML = `
            <div class="text-center py-20 text-gray-400 text-xs font-bold">
              ⏳ DB 데이터를 불러오는 중입니다...
            </div>`;
        }

        const response = await fetch(DATABASE_URL, { cache: 'no-cache' });

        if (!response.ok) {
          throw new Error(`DB 로딩 실패: HTTP ${response.status}`);
        }

        const database = await response.json();

        if (!Array.isArray(database) || database.length === 0) {
          throw new Error('DB 데이터가 비어 있거나 배열 형식이 아닙니다.');
        }

        // 현재 HTML의 기존 동작을 유지하기 위해
        // 도쿄 2400m + 도주 데이터만 선택합니다.
        const filteredDatabase = database.filter(skill =>
          skill.course_id === DATABASE_COURSE_ID &&
          skill.running_style === DATABASE_RUNNING_STYLE
        );

        if (filteredDatabase.length === 0) {
          throw new Error('도쿄 2400m / 도주 데이터가 DB에 없습니다.');
        }

        processRawData(filteredDatabase);
        renderPage1();
        updateSelectedCount();

      } catch (error) {
        console.error('[DB] JSON 로딩 오류:', error);

        if (container) {
          container.innerHTML = `
            <div class="text-center py-16 text-red-500 text-xs font-bold leading-relaxed">
              ⚠ 외부 DB를 불러오지 못했습니다.<br><br>
              <span class="text-gray-500 font-medium">
                ${error.message}<br><br>
                웹서버에서 페이지를 실행하고<br>
                data/margin.json 파일이 같은 경로에 있는지 확인해주세요.
              </span>
            </div>`;
        }
      }
    });

    function processRawData(dataList) {
      appSkills = dataList.map(skill => {
        let name = (skill.name || skill.Name || "이름 없음").toString().trim();
        let rarity = (skill.rarity || skill.Rarity || "노멀").toString().trim();
        let group = (skill.group || skill.Group || "0").toString().trim();
        let skillClass = (skill.class || skill.Class || "공용").toString().trim();
        let masin = parseFloat(skill.masin || skill.Masin) || 0;
        let pt = parseInt(skill.pt || skill.Pt || skill.cost || skill.Cost) || 100;
        let condition = (skill.condition || skill.Condition || "조건 정보 없음").toString().trim();

        return {
          name: name, rarity: rarity, group: group, class: skillClass,
          masin: masin, base_pt: pt, pt: pt, condition: condition,
          hint_level: 0, selected: false
        };
      });
      searchQuery = "";
    }

    function handleSearchQuery(val) {
      searchQuery = val.trim().toLowerCase();
      renderPage1();
    }

    function clearSearch() {
      const input = document.getElementById('skill-search-input');
      if(input) input.value = "";
      searchQuery = "";
      renderPage1();
    }

    function renderPage1() {
      const container = document.getElementById('skill-list-container');
      if (!container) return;
      container.innerHTML = '';
      if (appSkills.length === 0) return;

      const filtered = appSkills.filter(s => {
        if (!searchQuery) return true;
        return s.name.toLowerCase().includes(searchQuery) || 
               s.class.toLowerCase().includes(searchQuery) ||
               s.rarity.toLowerCase().includes(searchQuery);
      });

      if (isMasinSortMode) {
        filtered.sort((a, b) => b.masin - a.masin);
      }

      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center text-gray-400 py-16 text-xs">일치하는 스킬이 없습니다.</div>`;
        return;
      }

      filtered.forEach(skill => {
        const card = document.createElement('div');
        card.className = skill.selected ? `bg-blue-50/90 px-3 py-1.5 rounded-lg border-2 border-blue-500 cursor-pointer text-xs` : `bg-white px-3 py-1.5 rounded-lg border border-gray-200 hover:border-gray-300 cursor-pointer text-xs`;
        let labelColor = 'bg-orange-50 text-orange-700 border border-orange-200';
        if(skill.class === '가속력') labelColor = 'bg-cyan-50 text-cyan-700 border border-cyan-200';
        else if(skill.class === '고유') labelColor = 'bg-purple-50 text-purple-700 border border-purple-200';
        else if(skill.class === '시나리오') labelColor = 'bg-pink-50 text-pink-700 border border-pink-200';

        card.innerHTML = `
          <div class="flex justify-between items-center gap-2">
            <div class="flex items-center gap-1.5 min-w-0">
              <span class="w-1.5 h-1.5 rounded-full ${skill.selected ? 'bg-blue-600' : 'bg-gray-300'}"></span>
              <h3 class="font-extrabold ${skill.selected ? 'text-blue-900' : 'text-gray-900'} truncate">${skill.name}</h3>
            </div>
            <span class="px-1.5 py-0.5 text-[9px] rounded font-bold ${labelColor}">${skill.class}·${skill.rarity}</span>
          </div>
          <div class="flex justify-between items-center text-[10px] ${skill.selected ? 'text-blue-700/80' : 'text-gray-500'} mt-0.5 px-3">
            <span>비용: <strong class="font-bold">${skill.base_pt} pt</strong></span>
            <span>마신 이득: <strong class="font-bold text-gray-800">${skill.masin}</strong></span>
          </div>
        `;
        card.onclick = () => { skill.selected = !skill.selected; renderPage1(); updateSelectedCount(); };
        container.appendChild(card);
      });
    }

    function updateSelectedCount() {
      const count = appSkills.filter(s => s.selected).length;
      document.getElementById('selected-count-badge').innerText = `${count}개 고름`;
    }

    function resetAllSelections() {
      if (appSkills.length === 0) return;
      appSkills.forEach(skill => {
        skill.selected = false;
        skill.hint_level = 0;
      });
      clearSearch();
      updateSelectedCount();
    }

    function getDiscountedPt(basePt, hintLevel) {
      const hintRates = { 0: 0.0, 1: 0.10, 2: 0.20, 3: 0.30, 4: 0.35, 5: 0.40 };
      const discountRate = hintRates[hintLevel] || 0;
      const savantBonus = isSavant ? 0.10 : 0.0;
      const totalDiscount = Math.min(discountRate + savantBonus, 1.0);
      return Math.max(0, Math.floor(basePt - Math.round(basePt * totalDiscount)));
    }

    function toggleSavant() {
      isSavant = !isSavant;
      const btn = document.getElementById('btn-savant');
      const label = document.getElementById('btn-savant-label');
      if (isSavant) {
        btn.className = "w-full bg-amber-500 hover:bg-amber-600 border border-amber-400 text-white font-bold py-2 rounded-xl shadow-lg flex justify-center items-center gap-2 text-xs transition-all";
        label.textContent = "💼 수완가 적용 중 (-10% 추가 할인) ✓";
      } else {
        btn.className = "w-full bg-gray-700 hover:bg-gray-600 border border-gray-600 text-gray-300 font-bold py-2 rounded-xl shadow-lg flex justify-center items-center gap-2 text-xs transition-all";
        label.textContent = "💼 수완가 적용하기 (비활성)";
      }
      processCalculation();
    }

    function toggleSortMode() {
      const btn = document.getElementById('btn-toggle-sort');
      const title = document.getElementById('sheet-title');
      
      isSortMode = !isSortMode;
      if (isSortMode) {
        title.innerText = "📊 2단계: 최종 가성비 순위 결과";
        btn.innerHTML = "🔄 힌트/가격 다시 수정하기";
        btn.className = "w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-xl shadow-lg flex justify-center items-center gap-2 text-xs transition-all";
      } else {
        title.innerText = "🛠️ 1단계: 힌트 및 pt 사전 세팅";
        btn.innerHTML = "📊 최종 가성비 순위 정렬하기";
        btn.className = "w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded-xl shadow-lg flex justify-center items-center gap-2 text-xs transition-all";
      }
      processCalculation();
    }

    function toggleMasinSort() {
      isMasinSortMode = !isMasinSortMode;
      const btn = document.getElementById('btn-masin-sort');
      const label = document.getElementById('btn-masin-sort-label');
      if (isMasinSortMode) {
        btn.className = "bg-violet-600 hover:bg-violet-700 border border-violet-500 text-white font-bold py-2 px-2 rounded-xl shadow-sm flex flex-col justify-center items-center text-[10px] transition-all";
        label.textContent = "🔢 원래 순서로 되돌리기";
      } else {
        btn.className = "bg-violet-50 hover:bg-violet-100 border border-violet-300 text-violet-700 font-bold py-2 px-2 rounded-xl shadow-sm flex flex-col justify-center items-center text-[10px] transition-all";
        label.textContent = "🔢 마신 이득 순서로 정렬";
      }
      renderPage1();
    }

    function getLivePtOfSkill(skill) {
      return getDiscountedPt(skill.base_pt, skill.hint_level);
    }

    function getChainParentNames(skill, nameList = []) {
      if (skill.group && skill.group !== "0" && skill.group !== "") {
        let parentName = skill.group.trim();
        if (!nameList.includes(parentName)) {
          nameList.push(parentName);
          let parentSkill = appSkills.find(s => s.name === parentName);
          if (parentSkill) { getChainParentNames(parentSkill, nameList); }
        }
      }
      return nameList;
    }

    function getChainTotalPt(skill, visited = []) {
      let currentPt = getLivePtOfSkill(skill);
      if (visited.includes(skill.name)) return currentPt;
      visited.push(skill.name);

      if (skill.group && skill.group !== "0" && skill.group !== "") {
        let parentName = skill.group.trim();
        let parentSkill = appSkills.find(s => s.name === parentName);
        if (parentSkill) { return currentPt + getChainTotalPt(parentSkill, [...visited]); }
      }
      return currentPt;
    }

    function getVirtualChainTotalPt(skill, targetHintLevel, visited = []) {
      let currentPt = getDiscountedPt(skill.base_pt, targetHintLevel);
      if (visited.includes(skill.name)) return currentPt;
      visited.push(skill.name);

      if (skill.group && skill.group !== "0" && skill.group !== "") {
        let parentName = skill.group.trim();
        let parentSkill = appSkills.find(s => s.name === parentName);
        if (parentSkill) { return currentPt + getVirtualChainTotalPt(parentSkill, targetHintLevel, [...visited]); }
      }
      return currentPt;
    }

    function processCalculation() {
      const container = document.getElementById('calculation-container');
      if(!container) return;
      container.innerHTML = '';

      let selectedSkills = appSkills.filter(s => s.selected);
      if(selectedSkills.length === 0) {
        container.innerHTML = `<div class="text-center text-gray-400 py-16 text-xs">선택된 스킬이 없습니다.</div>`;
        return;
      }

      let displayPool = [...selectedSkills];

      if (isSortMode) {
        let allHiddenNames = [];
        selectedSkills.forEach(skill => {
          const checkRarity = skill.rarity.toLowerCase();
          const isUpperSkill = checkRarity.includes('레어') || skill.name.includes('◎');
          if (isUpperSkill) { getChainParentNames(skill, allHiddenNames); }
        });
        displayPool = selectedSkills.filter(skill => !allHiddenNames.includes(skill.name.trim()));
      }

      let calculationList = displayPool.map(skill => {
        let finalCostPt = getLivePtOfSkill(skill);
        let efficiencyDenominator = finalCostPt; 
        let isCombined = false;
        let isPureSingleUpper = false; 

        const checkRarity = skill.rarity.toLowerCase();
        const isUpperSkill = checkRarity.includes('레어') || skill.name.includes('◎');

        if (isSortMode && isUpperSkill && skill.group && skill.group !== "0" && skill.group.trim() !== "") {
          let parentName = skill.group.trim();
          let isParentSelected = selectedSkills.some(s => s.name === parentName);

          if (isParentSelected) {
            finalCostPt = getChainTotalPt(skill, []);
            efficiencyDenominator = finalCostPt;
            isCombined = true;
          } else {
            finalCostPt = getLivePtOfSkill(skill); 
            efficiencyDenominator = getVirtualChainTotalPt(skill, skill.hint_level, []);
            isPureSingleUpper = true;
          }
        }

        let efficiency = efficiencyDenominator > 0 ? ((skill.masin / efficiencyDenominator) * 100) : 0;

        return {
          ...skill,
          calculated_pt: finalCostPt,            
          efficiency_pt: efficiencyDenominator,   
          efficiency: efficiency,
          isCombined: isCombined,
          isPureSingleUpper: isPureSingleUpper
        };
      });

      if (isSortMode) {
        calculationList.sort((a, b) => b.efficiency - a.efficiency);
      }

      let userSpPool = parseInt(document.getElementById('input-user-sp').value) || 0;

      calculationList.forEach((skill, index) => {
        let isAffordable = userSpPool >= skill.calculated_pt;
        if (isAffordable) userSpPool -= skill.calculated_pt;

        const resultCard = document.createElement('div');
        resultCard.className = `p-3 rounded-xl bg-gray-800 text-xs text-white mb-2 border ${isAffordable ? 'border-green-500' : 'border-red-500/50 opacity-60'}`;

        // 🛠 1. 요구하신 대로 부모/자식 관련 부가 배지 및 하단 디테일 설명문 레이아웃을 통째로 탈거했습니다.
        // 🛠 2. 조건문 박스에서 'truncate'(말줄임표)를 빼고 'whitespace-normal break-all'을 추가하여 무조건 줄바꿈으로 전체 노출되게 변경했습니다.
        resultCard.innerHTML = `
          <div class="flex justify-between items-center">
            <div class="min-w-0 flex-1 pr-2">
              <div class="flex items-center gap-1 flex-wrap">
                <span class="text-[9px] ${isSortMode ? (isAffordable ? 'bg-green-500' : 'bg-gray-600') : 'bg-gray-700 text-gray-400'} px-1 py-0.2 rounded font-black shrink-0">
                  ${isSortMode ? (index + 1) + '위' : '세팅중'}
                </span>
                <h4 class="font-bold text-gray-100 text-xs truncate">${skill.name}</h4>
              </div>
              <p class="text-[10px] text-gray-400 mt-0.5">
                📊 가성비 효율: <span class="text-yellow-400 font-extrabold text-sm">${skill.efficiency.toFixed(2)}</span> 
                <span class="text-[9px] text-gray-500">(비용: ${skill.efficiency_pt}pt / 마신: ${skill.masin.toFixed(2)})</span>
              </p>
              
              <p class="text-[10px] text-gray-300 bg-gray-950/40 px-1.5 py-1 rounded mt-1.5 border border-gray-700/30 font-medium whitespace-normal break-all leading-relaxed">
                📋 조건: ${skill.condition}
              </p>
            </div>
            
            <div class="text-right shrink-0 flex items-center gap-1 bg-gray-900/80 border border-gray-700 px-2 py-1 rounded-lg">
              <span class="font-black text-xs text-green-400">${skill.calculated_pt}</span>
              <span class="text-[10px] text-gray-500 font-bold">pt</span>
            </div>
          </div>

          <div class="mt-2 pt-1.5 border-t border-gray-700/60 flex justify-between items-center text-[11px] ${isSortMode ? 'hidden' : ''}">
            <span class="text-gray-400 text-[10px]">인게임 힌트 등급 (해당 스킬만 독립 할인)</span>
            <div class="flex items-center bg-gray-700 rounded p-0.5">
              <button data-skill-name="${skill.name}" data-amount="-1" class="hint-btn w-5 h-5 flex items-center justify-center rounded bg-gray-600 font-bold text-white text-xs">-</button>
              <span class="w-10 text-center font-black text-gray-200 text-xs">Lv.${skill.hint_level}</span>
              <button data-skill-name="${skill.name}" data-amount="1" class="hint-btn w-5 h-5 flex items-center justify-center rounded bg-gray-600 font-bold text-white text-xs">+</button>
            </div>
          </div>
        `;
        container.appendChild(resultCard);
      });

      document.getElementById('text-remaining-sp').innerText = `${userSpPool} pt`;
    }

    // (기타 보조 함수 유지)
    function adjustHint(skillName, amount) {
      let skill = appSkills.find(s => s.name === skillName);
      if (!skill) return;
      let nextLevel = skill.hint_level + amount;
      if (nextLevel >= 0 && nextLevel <= 5) {
        skill.hint_level = nextLevel;
        processCalculation();
      }
    }

    function openBottomSheet() {
      isSortMode = false; 
      document.getElementById('sheet-title').innerText = "🛠️ 1단계: 힌트 및 pt 사전 세팅";
      const btn = document.getElementById('btn-toggle-sort');
      btn.innerHTML = "📊 최종 가성비 순위 정렬하기";
      btn.className = "w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded-xl shadow-lg flex justify-center items-center gap-2 text-xs transition-all";
      document.getElementById('bottom-sheet').classList.remove('translate-y-full');

      // 이벤트 위임: hint-btn 클릭 처리 (스킬 이름에 특수문자가 있어도 안전)
      // processCalculation()이 호출될 때마다 innerHTML이 재생성되므로 컨테이너에 한 번만 등록
      const calcContainer = document.getElementById('calculation-container');
      if (!calcContainer._hintListenerAttached) {
        calcContainer.addEventListener('click', function(e) {
          const hintBtn = e.target.closest('.hint-btn');
          if (!hintBtn) return;
          const skillName = hintBtn.dataset.skillName;
          const amount = parseInt(hintBtn.dataset.amount);
          adjustHint(skillName, amount);
        });
        calcContainer._hintListenerAttached = true;
      }

      processCalculation();
    }
    
    function closeBottomSheet() {
      document.getElementById('bottom-sheet').classList.add('translate-y-full');
      renderPage1();
    }
  </script>
</body>
</html>
