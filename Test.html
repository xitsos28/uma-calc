<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우마무스메 경기장 × 각질 스킬 가성비 계산기 V6</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .page-transition { transition: transform 0.3s ease-in-out; }
  </style>
</head>
<body class="bg-gray-100 font-sans">
  <!-- GitHub Pages용: data/ 폴더의 JSON/CSV DB를 자동으로 읽습니다. -->

  <div class="max-w-md mx-auto bg-white min-h-screen shadow-2xl flex flex-col relative overflow-hidden">
    
    <div id="page-1" class="flex-1 flex flex-col pb-4">
      <header class="bg-white p-3 shadow-sm sticky top-0 z-10 border-b border-gray-100">
        <div class="flex justify-between items-center mb-2">
          <div class="flex items-baseline gap-2 min-w-0">
            <h1 class="text-lg font-black text-gray-800 whitespace-nowrap">🐎 경기장 가성비 계산기</h1>
            <span class="text-sm font-extrabold text-gray-500 whitespace-nowrap">우마무스메 서클 GRAY</span>
          </div>
          <span id="selected-count-badge" class="bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full text-[10px] font-black whitespace-nowrap">0개 고름</span>
        </div>

        <div class="mb-2 p-2.5 bg-blue-50 border border-blue-200 rounded-lg">
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-[10px] text-blue-700 font-black mb-1">🏟 경기장</label>
              <select id="course-selector" onchange="changeDatabaseSelection()" class="w-full bg-white border border-blue-200 text-gray-800 rounded-lg px-2 py-2 text-xs font-bold focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">DB 불러오는 중...</option>
              </select>
            </div>
            <div>
              <label class="block text-[10px] text-blue-700 font-black mb-1">🏃 각질</label>
              <select id="style-selector" onchange="changeDatabaseSelection()" class="w-full bg-white border border-blue-200 text-gray-800 rounded-lg px-2 py-2 text-xs font-bold focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">DB 불러오는 중...</option>
              </select>
            </div>
          </div>
          <div class="flex items-center gap-1 mt-1.5">
            <p id="dataset-status" class="flex-1 min-w-0 text-[10px] text-gray-500 font-semibold text-center leading-tight">DB 데이터를 불러오는 중입니다...</p>
            <div class="shrink-0 flex items-center gap-1">
              <div class="flex items-center gap-0.5" title="저장 슬롯">
                <span class="text-[8px] text-gray-400 font-bold mr-0.5">💾</span>
                <button onclick="saveSelectedSkills(1)" class="bg-white border border-gray-300 text-gray-700 font-bold px-1.5 py-1 rounded-lg text-[9px] hover:bg-gray-50 whitespace-nowrap">1</button>
                <button onclick="saveSelectedSkills(2)" class="bg-white border border-gray-300 text-gray-700 font-bold px-1.5 py-1 rounded-lg text-[9px] hover:bg-gray-50 whitespace-nowrap">2</button>
                <button onclick="saveSelectedSkills(3)" class="bg-white border border-gray-300 text-gray-700 font-bold px-1.5 py-1 rounded-lg text-[9px] hover:bg-gray-50 whitespace-nowrap">3</button>
              </div>
              <div class="flex items-center gap-0.5" title="불러오기 슬롯">
                <span class="text-[8px] text-gray-400 font-bold mr-0.5">📥</span>
                <button onclick="loadSelectedSkills(1)" class="bg-white border border-gray-300 text-gray-700 font-bold px-1.5 py-1 rounded-lg text-[9px] hover:bg-gray-50 whitespace-nowrap">1</button>
                <button onclick="loadSelectedSkills(2)" class="bg-white border border-gray-300 text-gray-700 font-bold px-1.5 py-1 rounded-lg text-[9px] hover:bg-gray-50 whitespace-nowrap">2</button>
                <button onclick="loadSelectedSkills(3)" class="bg-white border border-gray-300 text-gray-700 font-bold px-1.5 py-1 rounded-lg text-[9px] hover:bg-gray-50 whitespace-nowrap">3</button>
              </div>
            </div>
          </div>
        </div>

        <div class="grid grid-cols-3 gap-1.5 mb-2">
          <button onclick="openBottomSheet()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-1.5 px-2 rounded-lg shadow-sm flex justify-center items-center gap-1 text-[9px] transition-all">
            <span>🛒 선택 완료</span><span class="text-[8px] font-black bg-blue-800/40 px-1 py-0.5 rounded">다음 →</span>
          </button>
          <button id="btn-masin-sort" onclick="toggleMasinSort()" class="bg-violet-50 hover:bg-violet-100 border border-violet-300 text-violet-700 font-bold py-1.5 px-2 rounded-lg shadow-sm flex justify-center items-center text-[9px] transition-all">
            <span id="btn-masin-sort-label">🔢 마신 이득 순서 정렬</span>
          </button>
          <button onclick="resetAllSelections()" class="bg-red-50 hover:bg-red-100 border border-red-200 text-red-600 font-bold py-1.5 px-2 rounded-lg shadow-sm flex justify-center items-center text-[9px] transition-all">
            <span>🔄 리셋</span>
          </button>
        </div>
        
        <div id="search-bar-container" class="relative mt-1">
          <input type="text" id="skill-search-input" oninput="handleSearchQuery(this.value)" placeholder="🔍 스킬 이름 또는 종류를 입력하세요" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 font-semibold">
          <button onclick="clearSearch()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 font-bold text-xs">✕</button>
        </div>
      </header>

      <main id="skill-list-container" class="flex-1 p-2 space-y-1.5 overflow-y-auto no-scrollbar max-h-[calc(100vh-165px)]">
      </main>
    </div>

    <div id="bottom-sheet" class="absolute inset-0 bg-gray-900 text-white z-20 page-transition transform translate-y-full flex flex-col">
      
      <div class="p-3 border-b border-gray-800 bg-gray-900 sticky top-0 z-30 space-y-2.5">
        <div class="flex justify-between items-center">
          <h2 id="sheet-title" class="text-base font-black text-gray-100">🛠️ 1단계: 힌트 및 pt 사전 세팅</h2>
          <button onclick="closeBottomSheet()" class="text-gray-400 hover:text-white font-bold text-xs bg-gray-800 px-2.5 py-1 rounded-lg">← 추가 선택</button>
        </div>

        <div class="grid grid-cols-3 gap-2 bg-gray-800 p-2.5 rounded-xl border border-gray-700">
          <div>
            <label class="block text-[10px] text-gray-400 font-bold mb-0.5">내 보유 SP 입력</label>
            <input type="number" id="input-user-sp" value="1200" oninput="processCalculation()" class="w-full bg-gray-700 text-white font-extrabold px-2.5 py-1 rounded-lg border border-gray-600 focus:outline-none focus:border-blue-500 text-xs">
          </div>
          <div class="text-right flex flex-col justify-center">
            <span class="text-[10px] text-gray-400 font-bold">배우고 남은 예상 SP</span>
            <span id="text-remaining-sp" class="text-sm font-black text-green-400">1200 pt</span>
          </div>
          <div class="text-right flex flex-col justify-center">
            <span class="text-[10px] text-gray-400 font-bold">총 마신이득</span>
            <span id="text-total-masin" class="text-sm font-black text-yellow-300">-</span>
          </div>
        </div>

        <div>
          <button id="btn-savant" onclick="toggleSavant()" class="w-full bg-gray-700 hover:bg-gray-600 border border-gray-600 text-gray-300 font-bold py-2 rounded-xl shadow-lg flex justify-center items-center gap-2 text-xs transition-all">
            <span id="btn-savant-label">💼 수완가 적용하기 (비활성)</span>
          </button>
        </div>
        <div>
          <button id="btn-toggle-sort" onclick="toggleSortMode()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded-xl shadow-lg flex justify-center items-center gap-2 text-xs transition-all">
            <span>📊 최종 가성비 순위 정렬하기</span>
          </button>
        </div>
      </div>

      <div id="calculation-container" class="flex-1 overflow-y-auto p-3 space-y-1.5 pb-8 no-scrollbar"></div>
    </div>

  </div>

  <script>
    // ==========================================
    // ⚙ 내장 DB + 외부 JSON 폴백
    // ==========================================
    // Windows에서 HTML을 더블클릭(file://)으로 열면 fetch()가 차단될 수 있으므로
    // DB를 HTML 안에 내장했습니다. data 폴더가 있는 경우에도 외부 JSON을 사용할 수 있습니다.
    const DATABASE_MARGIN_URLS = ["./margin.json", "./data/margin.json"];
    const DATABASE_SKILLS_URLS = ["./skills.json", "./data/skills.json"];
    const DATABASE_RELATIONS_URLS = ["./skill_relations.json", "./data/skill_relations.json"];
    const DATABASE_COURSES_URLS = ["./courses.json", "./data/courses.json"];
    const DATABASE_SKILL_NAMES_KO_URLS = ["./skill_names_ko.csv", "./data/skill_names_ko.csv"];

    let skillNameKoDatabase = {};

    const RUNNING_STYLE_KO = { runner: "도주", leader: "선행", betweener: "선입", chaser: "추입" };
    const RUNNING_STYLE_JP = { runner: "逃げ", leader: "先行", betweener: "差し", chaser: "追込" };
    const CATEGORY_KO = { "固有":"고유", "中盤":"중반", "終盤":"종반", "特定条件":"특정 조건", "パッシブ":"패시브", "序盤":"초반" };

    function getCategoryKo(category, fallback = "공용") {
      const value = String(category ?? "").trim();
      return CATEGORY_KO[value] || value || fallback;
    }

    let marginDatabase = [];
    let skillDatabase = {};
    let relationDatabase = {};
    let courseDatabase = {};
    let appSkills = [];
    let searchQuery = "";
    let isSortMode = false;
    let isSavant = false;
    let isMasinSortMode = false;
    let selectedCourseId = "";
    let selectedRunningStyle = "runner";

    // 브라우저 저장소: 경기장 × 각질별로 선택 스킬과 힌트 레벨을 저장합니다.
    const SELECTION_STORAGE_KEY = "umamusume_skill_calculator_saved_selections_v1";

    // =========================================================
    // 외부 DB 연동
    // GitHub Pages 기본 경로: HTML과 같은 저장소의 ./data/*.json
    // GitHub Pages의 ./data/*.json을 자동으로 읽습니다.
    // =========================================================
    async function readJsonFile(file) {
      const text = await file.text();
      try {
        return JSON.parse(text);
      } catch (e) {
        throw new Error(`${file.name} JSON 파싱 실패: ${e.message}`);
      }
    }

    function parseCsvLine(line) {
      const out = []; let cur = ""; let quoted = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') {
          if (quoted && line[i + 1] === '"') { cur += '"'; i++; }
          else quoted = !quoted;
        } else if (ch === ',' && !quoted) { out.push(cur); cur = ""; }
        else cur += ch;
      }
      out.push(cur);
      return out.map(v => v.trim());
    }

    async function readSkillNamesKoCsvText(text) {
      const rows = String(text || '').replace(/^\uFEFF/, '').split(/\r?\n/).filter(Boolean);
      const map = {};
      for (let i = 1; i < rows.length; i++) {
        const cols = parseCsvLine(rows[i]);
        if (cols.length >= 2 && cols[0]) map[String(cols[0])] = cols[1];
      }
      return map;
    }

    function mergeKoreanSkillNames(map) {
      if (!map || !Object.keys(map).length) return;
      for (const [id, name] of Object.entries(map)) {
        const skill = skillDatabase[String(id)];
        if (skill && name) skill.skill_name_ko = name;
      }
      skillNameKoDatabase = map;
    }

    function countKoreanNames(db) {
      return Object.values(db || {}).filter(v => String(v?.skill_name_ko || v?.name_ko || '').trim()).length;
    }

    async function loadDatabaseFromDirectory(dirHandle) {
      const marginFile = await (await dirHandle.getFileHandle('margin.json')).getFile();
      const skillsFile = await (await dirHandle.getFileHandle('skills.json')).getFile();
      const relationsFile = await (await dirHandle.getFileHandle('skill_relations.json')).getFile();

      let coursesFile = null;
      let coursesCsvFile = null;
      try { coursesFile = await (await dirHandle.getFileHandle('courses.json')).getFile(); } catch (_) {}
      if (!coursesFile) { try { coursesCsvFile = await (await dirHandle.getFileHandle('courses.csv')).getFile(); } catch (_) {} }

      const [m, s, r] = await Promise.all([
        readJsonFile(marginFile), readJsonFile(skillsFile), readJsonFile(relationsFile)
      ]);

      let c = {};
      if (coursesFile) {
        c = await readJsonFile(coursesFile);
      } else if (coursesCsvFile) {
        const text = await coursesCsvFile.text();
        const rows = text.replace(/^\uFEFF/, '').split(/\r?\n/).filter(Boolean);
        for (let i = 1; i < rows.length; i++) {
          const cols = parseCsvLine(rows[i]);
          if (cols.length >= 2 && cols[0]) c[String(cols[0])] = { course_name: cols[1], course_name_ko: cols[1] };
        }
      } else {
        throw new Error('courses.json 또는 courses.csv를 찾을 수 없습니다.');
      }

      marginDatabase = m; skillDatabase = s; relationDatabase = r; courseDatabase = c;

      // 한국어 이름 CSV가 별도로 있는 DB도 지원
      try {
        const koFile = await (await dirHandle.getFileHandle('skill_names_ko.csv')).getFile();
        mergeKoreanSkillNames(await readSkillNamesKoCsvText(await koFile.text()));
      } catch (_) {}

      window.__dbSource = '선택한 DB 폴더';
      validateKoreanSkillNames();
    }

    function validateKoreanSkillNames() {
      const count = countKoreanNames(skillDatabase);
      const total = Object.keys(skillDatabase || {}).length;
      if (total && count < Math.min(100, total * 0.9)) {
        throw new Error(`한국어 스킬명이 없는 DB입니다 (${count}/${total}). 최신 DB 폴더를 선택하세요.`);
      }
    }

    async function fetchFirstOk(urls) {
      for (const url of urls) {
        try {
          const r = await fetch(url, { cache: 'no-store' });
          if (r.ok) return r;
        } catch (_) {}
      }
      throw new Error('파일을 찾을 수 없습니다.');
    }

    async function loadDatabase() {
      try {
        const [m, s, r, c] = await Promise.all([
          fetchFirstOk(DATABASE_MARGIN_URLS),
          fetchFirstOk(DATABASE_SKILLS_URLS),
          fetchFirstOk(DATABASE_RELATIONS_URLS),
          fetchFirstOk(DATABASE_COURSES_URLS)
        ]);
        const [mj, sj, rj, cj] = await Promise.all([m.json(), s.json(), r.json(), c.json()]);
        marginDatabase = mj; skillDatabase = sj; relationDatabase = rj; courseDatabase = cj;

        // skills.json에 한국어명이 없던 구형 DB라면 별도 CSV를 합칩니다.
        try {
          const ko = await fetchFirstOk(DATABASE_SKILL_NAMES_KO_URLS);
          mergeKoreanSkillNames(await readSkillNamesKoCsvText(await ko.text()));
        } catch (_) {}

        validateKoreanSkillNames();
        window.__dbSource = './data/*.json';
        return;
      } catch (relativeError) {
        window.__dbLoadError = relativeError;
        throw new Error('GitHub Pages용 DB를 자동으로 읽지 못했습니다. 저장소의 data 폴더에 최신 DB 파일이 있는지 확인하세요.');
      }
    }

    function updateDbStatus(prefix = 'DB 준비 완료') {
      const statusEl = document.getElementById('dataset-status');
      if (!statusEl) return;
      statusEl.textContent = 'DB 준비 완료';
    }

    function hasValidBasePt(skillId) {
      const master = getSkillMaster(skillId);
      if (!master || Object.keys(master).length === 0) return false;
      if (master.pt === null || master.pt === undefined || master.pt === "") return false;
      const pt = Number(master.pt);
      return Number.isFinite(pt) && pt > 0;
    }

    window.addEventListener('DOMContentLoaded', async () => {
      const container = document.getElementById('skill-list-container');
      try {
        if (container) container.innerHTML = `<div class="text-center py-20 text-gray-400 text-xs font-bold">⏳ DB 데이터를 불러오는 중입니다...</div>`;
        await loadDatabase();
        if (!Array.isArray(marginDatabase) || marginDatabase.length === 0) throw new Error('margin 데이터가 비어 있습니다.');
        if (!skillDatabase || typeof skillDatabase !== 'object') throw new Error('skills 데이터 형식 오류');
        if (!relationDatabase || typeof relationDatabase !== 'object') throw new Error('relation 데이터 형식 오류');
        if (!courseDatabase || typeof courseDatabase !== 'object') throw new Error('course 데이터 형식 오류');
        populateSelectors();
        const firstCourse = Object.keys(courseDatabase)[0];
        if (!selectedCourseId && firstCourse) selectedCourseId = String(firstCourse);
        document.getElementById('course-selector').value = selectedCourseId;
        document.getElementById('style-selector').value = selectedRunningStyle;
        await loadSelectedDataset();
        updateDbStatus();
      } catch (error) {
        console.error('[DB] 로딩 오류:', error);
        if (container) container.innerHTML = `<div class="text-center py-16 text-red-500 text-xs font-bold leading-relaxed">⚠ DB를 불러오지 못했습니다.<br><br><span class="text-gray-500 font-medium">${escapeHtml(error.message)}</span></div>`;
        const statusEl = document.getElementById('dataset-status');
        if (statusEl) statusEl.textContent = `DB 오류: ${error.message}`;
      }
    });

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function getCourseName(courseId) {
      const course = courseDatabase[String(courseId)] || courseDatabase[courseId];
      if (!course) {
        const row = marginDatabase.find(r => String(r.course_id) === String(courseId) && r.course_name);
        return row?.course_name || `경기장 ${courseId}`;
      }

      return (
        course.course_name_ko ||
        course.name_ko ||
        course.course_name ||
        course.name ||
        `경기장 ${courseId}`
      ).toString();
    }

    function getSkillKoName(skillId, fallback = "이름 없음") {
      const skill = skillDatabase[String(skillId)] || skillDatabase[skillId];
      if (!skill) return fallback;

      return (
        skill.skill_name_ko ||
        skill.name_ko ||
        skillNameKoDatabase[String(skillId)] ||
        fallback
      ).toString().trim() || fallback;
    }

    function populateSelectors() {
      const courseSelector = document.getElementById('course-selector');
      const styleSelector = document.getElementById('style-selector');

      const courseIds = Object.keys(courseDatabase)
        .filter(id => marginDatabase.some(row => String(row.course_id) === String(id)))
        .sort((a, b) => Number(a) - Number(b));

      courseSelector.innerHTML = courseIds.length
        ? courseIds.map(id =>
            `<option value="${escapeHtml(id)}">${escapeHtml(getCourseName(id))}</option>`
          ).join("")
        : `<option value="">사용 가능한 경기장이 없습니다.</option>`;

      styleSelector.innerHTML = Object.entries(RUNNING_STYLE_KO)
        .map(([key, name]) => `<option value="${key}">${name}</option>`)
        .join("");

      if (!courseIds.includes(String(selectedCourseId))) {
        selectedCourseId = courseIds[0] || "";
      }
    }

    async function changeDatabaseSelection() {
      const courseSelector = document.getElementById('course-selector');
      const styleSelector = document.getElementById('style-selector');

      selectedCourseId = courseSelector.value;
      selectedRunningStyle = styleSelector.value;

      isSortMode = false;
      isMasinSortMode = false;
      searchQuery = "";
      document.getElementById('skill-search-input').value = "";

      await loadSelectedDataset();
    }

    async function loadSelectedDataset() {
      const container = document.getElementById('skill-list-container');
      const status = document.getElementById('dataset-status');

      if (!selectedCourseId || !selectedRunningStyle) return;

      if (container) {
        container.innerHTML = `
          <div class="text-center py-20 text-gray-400 text-xs font-bold">
            ⏳ ${escapeHtml(getCourseName(selectedCourseId))} / ${escapeHtml(RUNNING_STYLE_KO[selectedRunningStyle])} 데이터를 불러오는 중입니다...
          </div>`;
      }

      const courseStyleDatabase = marginDatabase.filter(row =>
        String(row.course_id) === String(selectedCourseId) &&
        (
          String(row.running_style) === String(selectedRunningStyle) ||
          String(row.running_style_name) === String(RUNNING_STYLE_JP[selectedRunningStyle]) ||
          String(row.running_style_name) === String(RUNNING_STYLE_KO[selectedRunningStyle])
        )
      );

      // margin.json에 존재하더라도 skills.json의 기본 PT가 null이면
      // 가성비 계산 대상에서 완전히 제외합니다.
      const filteredDatabase = courseStyleDatabase.filter(row =>
        hasValidBasePt(row.skill_id)
      );
      const excludedNullPtCount = courseStyleDatabase.length - filteredDatabase.length;

      if (filteredDatabase.length === 0) {
        appSkills = [];
        if (status) status.textContent = `${getCourseName(selectedCourseId)} / ${RUNNING_STYLE_KO[selectedRunningStyle]} 데이터가 없습니다.`;
        if (container) {
          container.innerHTML = `
            <div class="text-center py-16 text-gray-400 text-xs font-bold">
              해당 경기장 × 각질의 마신 데이터가 없습니다.
            </div>`;
        }
        updateSelectedCount();
        return;
      }

      processRawData(filteredDatabase);
      if (status) {
        const excludedText = excludedNullPtCount > 0
          ? ` · PT null ${excludedNullPtCount}개 제외`
          : "";
        status.textContent = `✅ ${getCourseName(selectedCourseId)} / ${RUNNING_STYLE_KO[selectedRunningStyle]} · ${appSkills.length}개 스킬${excludedText} · 외부 margin ${courseStyleDatabase.length}행`;
      }

      renderPage1();
      updateSelectedCount();
    }

    // ==========================================
    // 🔗 스킬 상/하위 관계: skill_id + relations 기준
    // ==========================================
    // 현재 DB의 upper_lower_skill_ids는 상/하위 관계를 ID로 보관합니다.
    // 이 값은 방향이 없는 경우가 있으므로, 관계 전체를 그래프로 보고
    // 가장 높은 단계(레어 > ◎ > ○)를 대표 스킬로 사용합니다.

    function getSkillMaster(skillId) {
      const id = String(skillId ?? '').trim();
      return skillDatabase[id] || skillDatabase[Number(id)] || {};
    }

    function getSkillRelations(skillId) {
      const id = String(skillId ?? '').trim();
      const relation = relationDatabase[id] || relationDatabase[Number(id)] || {};
      if (relation && typeof relation === 'object' && Object.keys(relation).length) return relation;
      return getSkillMaster(id).relations || {};
    }

    // skills.json의 rarity를 기준으로 상/하위를 판별합니다.
    // 우선순위: SSR > SR > R
    // 같은 rarity가 여러 개 연결된 경우에는 기본 스킬 PT가 높은 쪽을 상위로 봅니다.
    // (예: R 90 -> R 110 관계라면 R 110을 상위/대표로 사용)
    // 화면에 표시할 명칭만 변경합니다.
    // 내부 rarity 값(R/SR/SSR)은 계산 로직에서 그대로 사용합니다.
    function getDisplayRarity(rarity) {
      const value = String(rarity || '').trim();
      if (value === 'R') return '노멀';
      if (value === 'SR') return '레어';
      return value;
    }

    function getRarityRank(skill) {
      if (!skill) return 0;
      const master = getSkillMaster(skill.skill_id);
      const rarity = String(
        skill.rarity || master.rarity || master.Rarity || ''
      ).trim().toUpperCase();

      if (rarity === 'SSR') return 3;
      if (rarity === 'SR') return 2;
      if (rarity === 'R') return 1;

      // DB에 다른 표기가 들어오는 경우를 위한 보조 처리
      if (rarity.includes('SSR')) return 3;
      if (rarity.includes('SR')) return 2;
      if (rarity.includes('RARE') || rarity.includes('레어')) return 2;
      return 0;
    }

    function getSkillBasePt(skill) {
      if (!skill) return 0;
      const master = getSkillMaster(skill.skill_id);
      return Number(
        skill.base_pt ??
        skill.pt ??
        master.pt ??
        master.Pt ??
        master.cost ??
        master.Cost ??
        0
      ) || 0;
    }

    // a보다 b가 상위 스킬이면 양수입니다.
    // 1순위: rarity (SSR > SR > R)
    // 2순위: 같은 rarity라면 기본 스킬 PT가 높은 쪽
    function compareSkillHierarchy(a, b) {
      const rarityDiff = getRarityRank(b) - getRarityRank(a);
      if (rarityDiff !== 0) return rarityDiff;
      return getSkillBasePt(b) - getSkillBasePt(a);
    }

    // 기존 코드와의 호환을 위해 tier 함수는 유지하되,
    // 실제 상/하위 판정은 rarity + 기본 PT 비교를 사용합니다.
    function getSkillTier(skill) {
      return getRarityRank(skill);
    }

    function getUpperLowerRelationIds(skill) {
      const master = getSkillMaster(skill.skill_id);
      const relations = getSkillRelations(skill.skill_id) || skill.relations || {};
      return [...new Set(
        (relations.upper_lower_skill_ids || [])
          .map(id => String(id).trim())
          .filter(Boolean)
      )];
    }

    function makeSkillFromMaster(skillId) {
      const id = String(skillId ?? '').trim();
      const master = getSkillMaster(id);
      if (!master || Object.keys(master).length === 0) return null;

      const name = getSkillKoName(
        id,
        master.skill_name_ko || master.name_ko || master.name || master.name_jp || '이름 없음'
      );
      const rarity = String(master.rarity || master.Rarity || '노멀').trim();
      const pt = Number(master.pt ?? master.Pt ?? master.cost ?? master.Cost);
      if (!Number.isFinite(pt) || pt <= 0) return null;
      const category = getCategoryKo(master.category ?? master.Category ?? master.class ?? master.Class ?? '공용');

      return {
        skill_id: id,
        name,
        rarity,
        group: '',
        class: category,
        masin: 0,
        base_pt: pt,
        pt,
        condition: String(master.condition || master.Condition || master.activation_condition || master.description || '조건 정보 없음').trim(),
        relations: getSkillRelations(skillId) || {},
        hint_level: 0,
        selected: false,
        _virtual: true
      };
    }

    // 관계 그룹용: "직접 연결된 스킬"만 반환합니다.
    //
    // 중요:
    // upper_lower_skill_ids를 그래프 전체로 재귀 탐색하면
    // A -> B -> C -> D처럼 진화/관련 스킬을 따라가면서 서로 다른 스킬군이
    // 하나의 그룹으로 합쳐질 수 있습니다.
    // 예: 터다지기 -> 만반의 준비 -> 진화 스킬 -> 다른 캐릭터 스킬
    // 이런 전이적 연결은 추천 단계의 합치기 대상이 아닙니다.
    // 따라서 현재 스킬과 직접 연결된 ID만 사용합니다.
    function getDirectRelatedSkillIds(skillId) {
      const target = String(skillId ?? '').trim();
      const result = new Set([target]);

      const ownRelations = getSkillRelations(target) || {};
      (ownRelations.upper_lower_skill_ids || []).forEach(id => {
        const sid = String(id ?? '').trim();
        if (sid) result.add(sid);
      });

      // DB가 한쪽 방향으로만 기록된 경우도 대응합니다.
      Object.keys(skillDatabase || {}).forEach(id => {
        const sid = String(id);
        if (sid === target) return;
        const relations = getSkillRelations(sid) || {};
        const ids = (relations.upper_lower_skill_ids || [])
          .map(x => String(x ?? '').trim())
          .filter(Boolean);
        if (ids.includes(target)) result.add(sid);
      });

      return [...result];
    }

    // 기존 함수명은 다른 계산 코드와의 호환을 위해 유지합니다.
    // 이제부터는 전이적 그래프 탐색을 하지 않습니다.
    function getRelatedSkillIds(skillId) {
      return getDirectRelatedSkillIds(skillId);
    }

    function getSkillObject(skillId) {
      const id = String(skillId);
      return appSkills.find(s => String(s.skill_id) === id) || makeSkillFromMaster(id);
    }

    // 관계 그룹의 대표 스킬 = rarity가 가장 높은 스킬.
    // 같은 rarity라면 기본 스킬 PT가 높은 스킬을 우선합니다.
    function getRepresentativeSkill(skill) {
      const ids = getDirectRelatedSkillIds(skill.skill_id);
      const candidates = ids.map(getSkillObject).filter(Boolean);
      if (!candidates.length) return skill;

      candidates.sort((a, b) => compareSkillHierarchy(a, b));
      return candidates[0] || skill;
    }

    function getRelatedSelectedSkills(skill, selectedSkills) {
      const ids = new Set(getRelatedSkillIds(skill.skill_id));
      return selectedSkills.filter(s => ids.has(String(s.skill_id)));
    }

    // 대표 스킬의 하위 체인을 찾습니다.
    function getLowerSkills(skill) {
      const relationIds = getUpperLowerRelationIds(skill);
      if (relationIds.length === 0) return [];

      const candidates = relationIds
        .map(getSkillObject)
        .filter(Boolean);

      // 현재 스킬보다 실제로 낮은 계층인 후보를 모두 반환합니다.
      // R+R+SR 구조처럼 하나의 SR에 하위 R이 2개 이상 존재할 수 있으므로
      // 단일 하위 스킬만 고르면 안 됩니다.
      const lower = candidates.filter(candidate => {
        // '○/◎' 계열의 상위·하위 체인과 무관한 '×' 스킬은
        // upper_lower_skill_ids가 같은 관계 그룹으로 묶여 있어도
        // 필수 선행 스킬이나 마신 차감 대상으로 취급하지 않습니다.
        const name = String(
          candidate.name ||
          candidate.skill_name_ko ||
          candidate.skill_name ||
          ''
        ).trim();
        if (name.includes('×')) return false;

        return compareSkillHierarchy(candidate, skill) > 0;
      });

      lower.sort((a, b) => compareSkillHierarchy(a, b));
      return lower;
    }

    function getLowerSkill(skill) {
      const lower = getLowerSkills(skill);
      return lower.length ? lower[0] : null;
    }

    // 현재 스킬을 찍기 위해 먼저 필요한 모든 하위 스킬을 찾습니다.
    // R+R+SR처럼 한 단계에 하위 스킬이 2개 이상 있는 경우도 모두 포함합니다.
    function getAllLowerSkillChain(skill, result = [], visited = []) {
      if (!skill) return result;
      const currentId = String(skill.skill_id);
      if (visited.includes(currentId)) return result;

      const nextVisited = [...visited, currentId];
      const lowerSkills = getLowerSkills(skill);

      lowerSkills.forEach(lowerSkill => {
        const lowerId = String(lowerSkill.skill_id);
        if (!result.some(s => String(s.skill_id) === lowerId)) {
          result.push(lowerSkill);
        }
        getAllLowerSkillChain(lowerSkill, result, nextVisited);
      });

      return result;
    }

    // 기존 코드와의 호환을 위해 ID 배열을 반환하는 함수도 유지합니다.
    function getLowerSkillChain(skill, result = [], visited = []) {
      const skills = getAllLowerSkillChain(skill, [], visited);
      skills.forEach(lowerSkill => {
        const id = String(lowerSkill.skill_id);
        if (!result.includes(id)) result.push(id);
      });
      return result;
    }

    function processRawData(dataList) {
      // 2중 방어: 호출 측에서 걸러졌더라도 여기서 PT null을 다시 차단합니다.
      appSkills = dataList.filter(skill => {
        const skillId = String(skill.skill_id ?? skill.id ?? "").trim();
        return hasValidBasePt(skillId);
      }).map(skill => {
        const skillId = String(skill.skill_id ?? skill.id ?? "").trim();
        const master = skillDatabase[skillId] || skillDatabase[Number(skillId)] || {};

        const name =
          getSkillKoName(skillId,
            skill.skill_name_ko ||
            skill.name ||
            skill.Name ||
            master.skill_name_ko ||
            master.name_ko ||
            master.name_jp ||
            "이름 없음"
          );

        const rarity = (
          skill.rarity ||
          skill.Rarity ||
          master.rarity ||
          master.Rarity ||
          "노멀"
        ).toString().trim();

        const group =
          skill.group ||
          skill.Group ||
          master.group ||
          master.Group ||
          "";

        const rawCategory = (
          master.category ??
          master.Category ??
          skill.category ??
          skill.class ??
          skill.Class ??
          master.class ??
          "공용"
        ).toString().trim();
        const skillClass = getCategoryKo(rawCategory);

        const masin = parseFloat(
          skill.masin ?? skill.Masin ?? skill.margin ?? 0
        ) || 0;

        const pt = Number(
          master.pt ??
          skill.pt ??
          skill.Pt ??
          skill.cost ??
          skill.Cost
        );

        // 이 함수는 PT 유효 데이터만 받도록 되어 있으므로,
        // 비정상 데이터가 들어오면 해당 스킬을 생성하지 않습니다.
        if (!Number.isFinite(pt) || pt <= 0) return null;

        const condition = (
          skill.condition ||
          skill.Condition ||
          master.condition ||
          master.activation_condition ||
          master.description ||
          "조건 정보 없음"
        ).toString().trim();

        return {
          skill_id: skillId,
          name: name,
          rarity: rarity,
          group: "",
          class: skillClass,
          masin: masin,
          base_pt: pt,
          pt: pt,
          condition: condition,
          relations: getSkillRelations(skillId) || {},
          hint_level: 0,
          selected: false
        };
      }).filter(Boolean);
      searchQuery = "";
    }

    function handleSearchQuery(val) {
      searchQuery = val.trim().toLowerCase();
      renderPage1();
    }

    function clearSearch() {
      const input = document.getElementById('skill-search-input');
      if(input) input.value = "";
      searchQuery = "";
      renderPage1();
    }

    function renderPage1() {
      const container = document.getElementById('skill-list-container');
      if (!container) return;
      container.innerHTML = '';
      if (appSkills.length === 0) return;

      const filtered = appSkills.filter(s => {
        if (!searchQuery) return true;
        const displayRarity = getDisplayRarity(s.rarity).toLowerCase();
        return s.name.toLowerCase().includes(searchQuery) || 
               s.class.toLowerCase().includes(searchQuery) ||
               s.rarity.toLowerCase().includes(searchQuery) ||
               displayRarity.includes(searchQuery);
      });

      if (isMasinSortMode) {
        filtered.sort((a, b) => b.masin - a.masin);
      }

      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center text-gray-400 py-16 text-xs">일치하는 스킬이 없습니다.</div>`;
        return;
      }

      filtered.forEach(skill => {
        const card = document.createElement('div');
        card.className = skill.selected ? `bg-blue-50/90 px-3 py-1.5 rounded-lg border-2 border-blue-500 cursor-pointer text-xs` : `bg-white px-3 py-1.5 rounded-lg border border-gray-200 hover:border-gray-300 cursor-pointer text-xs`;
        let labelColor = 'bg-orange-50 text-orange-700 border border-orange-200';
        if(skill.class === '가속력') labelColor = 'bg-cyan-50 text-cyan-700 border border-cyan-200';
        else if(skill.class === '고유') labelColor = 'bg-purple-50 text-purple-700 border border-purple-200';
        else if(skill.class === '시나리오') labelColor = 'bg-pink-50 text-pink-700 border border-pink-200';

        card.innerHTML = `
          <div class="flex justify-between items-center gap-2">
            <div class="flex items-center gap-1.5 min-w-0">
              <span class="w-1.5 h-1.5 rounded-full ${skill.selected ? 'bg-blue-600' : 'bg-gray-300'}"></span>
              <h3 class="font-extrabold ${skill.selected ? 'text-blue-900' : 'text-gray-900'} truncate">${escapeHtml(skill.name)}</h3>
            </div>
            <span class="px-1.5 py-0.5 text-[9px] rounded font-bold ${labelColor}">${escapeHtml(skill.class)}·${escapeHtml(getDisplayRarity(skill.rarity))}</span>
          </div>
          <div class="flex justify-between items-center text-[10px] ${skill.selected ? 'text-blue-700/80' : 'text-gray-500'} mt-0.5 px-3">
            <span>비용: <strong class="font-bold">${skill.base_pt} pt</strong></span>
            <span>마신 이득: <strong class="font-bold text-gray-800">${skill.masin}</strong></span>
          </div>
        `;
        card.onclick = () => { skill.selected = !skill.selected; renderPage1(); updateSelectedCount(); };
        container.appendChild(card);
      });
    }

    function updateSelectedCount() {
      const count = appSkills.filter(s => s.selected).length;
      document.getElementById('selected-count-badge').innerText = `${count}개 고름`;
    }

    function getSelectionStorageKey(courseId = selectedCourseId, runningStyle = selectedRunningStyle) {
      return `${String(courseId)}__${String(runningStyle)}`;
    }

    function readSavedSelections() {
      try {
        const raw = localStorage.getItem(SELECTION_STORAGE_KEY);
        if (!raw) return {};

        const data = JSON.parse(raw);
        if (!data || typeof data !== 'object') return {};

        // 구버전(슬롯 없이 course__style을 바로 키로 사용)을
        // 슬롯 1로 자동 호환합니다.
        if (!data.slots && Object.keys(data).some(key => key.includes('__'))) {
          return {
            slots: {
              "1": data
            }
          };
        }

        return data;
      } catch (error) {
        console.warn('[SAVE] 저장 데이터 읽기 실패:', error);
        return {};
      }
    }

    function saveSelectedSkills(slot = 1) {
      slot = Number(slot);
      if (![1, 2, 3].includes(slot)) slot = 1;

      if (!selectedCourseId || !selectedRunningStyle || appSkills.length === 0) {
        alert('현재 저장할 스킬 데이터가 없습니다.');
        return;
      }

      try {
        const saved = readSavedSelections();
        if (!saved.slots || typeof saved.slots !== 'object') {
          saved.slots = {};
        }

        const key = getSelectionStorageKey();
        const selected = appSkills
          .filter(skill => skill.selected)
          .map(skill => ({
            skill_id: String(skill.skill_id),
            hint_level: Number(skill.hint_level) || 0
          }));

        if (!saved.slots[String(slot)] || typeof saved.slots[String(slot)] !== 'object') {
          saved.slots[String(slot)] = {};
        }

        saved.slots[String(slot)][key] = {
          course_id: String(selectedCourseId),
          running_style: String(selectedRunningStyle),
          saved_at: new Date().toISOString(),
          selected
        };

        localStorage.setItem(SELECTION_STORAGE_KEY, JSON.stringify(saved));

        alert(`선택 저장 완료 (슬롯 ${slot})
${selected.length}개 스킬이 브라우저에 저장되었습니다.`);
      } catch (error) {
        console.error('[SAVE] 저장 실패:', error);
        alert(`선택 저장에 실패했습니다.
${error.message}`);
      }
    }

    function loadSelectedSkills(slot = 1) {
      slot = Number(slot);
      if (![1, 2, 3].includes(slot)) slot = 1;

      if (!selectedCourseId || !selectedRunningStyle || appSkills.length === 0) {
        alert('현재 불러올 스킬 데이터가 없습니다.');
        return;
      }

      try {
        const saved = readSavedSelections();
        const slotData = saved.slots?.[String(slot)] || {};
        const data = slotData[getSelectionStorageKey()];

        if (!data || !Array.isArray(data.selected)) {
          alert(`슬롯 ${slot}에 저장된 선택이 없습니다.
현재 경기장/각질: ${getCourseName(selectedCourseId)} / ${RUNNING_STYLE_KO[selectedRunningStyle]}`);
          return;
        }

        const savedMap = new Map(
          data.selected.map(item => [
            String(item.skill_id),
            Math.max(0, Math.min(5, Number(item.hint_level) || 0))
          ])
        );

        let restored = 0;
        appSkills.forEach(skill => {
          const id = String(skill.skill_id);
          if (savedMap.has(id)) {
            skill.selected = true;
            skill.hint_level = savedMap.get(id);
            restored++;
          } else {
            skill.selected = false;
            skill.hint_level = 0;
          }
        });

        isSortMode = false;
        isMasinSortMode = false;
        searchQuery = "";
        const input = document.getElementById('skill-search-input');
        if (input) input.value = "";

        renderPage1();
        updateSelectedCount();
        processCalculation();
        alert(`선택 불러오기 완료 (슬롯 ${slot})
${restored}개 스킬을 복원했습니다.`);
      } catch (error) {
        console.error('[SAVE] 불러오기 실패:', error);
        alert(`선택 불러오기에 실패했습니다.
${error.message}`);
      }
    }

    function resetAllSelections() {
      if (appSkills.length === 0) return;
      appSkills.forEach(skill => {
        skill.selected = false;
        skill.hint_level = 0;
      });
      clearSearch();
      updateSelectedCount();
    }

    function getDiscountedPt(basePt, hintLevel) {
      const hintRates = { 0: 0.0, 1: 0.10, 2: 0.20, 3: 0.30, 4: 0.35, 5: 0.40 };
      const discountRate = hintRates[hintLevel] || 0;
      const savantBonus = isSavant ? 0.10 : 0.0;
      const totalDiscount = Math.min(discountRate + savantBonus, 1.0);
      return Math.max(0, Math.floor(basePt - Math.round(basePt * totalDiscount)));
    }

    function toggleSavant() {
      isSavant = !isSavant;
      const btn = document.getElementById('btn-savant');
      const label = document.getElementById('btn-savant-label');
      if (isSavant) {
        btn.className = "w-full bg-amber-500 hover:bg-amber-600 border border-amber-400 text-white font-bold py-2 rounded-xl shadow-lg flex justify-center items-center gap-2 text-xs transition-all";
        label.textContent = "💼 수완가 적용 중 (-10% 추가 할인) ✓";
      } else {
        btn.className = "w-full bg-gray-700 hover:bg-gray-600 border border-gray-600 text-gray-300 font-bold py-2 rounded-xl shadow-lg flex justify-center items-center gap-2 text-xs transition-all";
        label.textContent = "💼 수완가 적용하기 (비활성)";
      }
      processCalculation();
    }

    function toggleSortMode() {
      const btn = document.getElementById('btn-toggle-sort');
      const title = document.getElementById('sheet-title');
      
      isSortMode = !isSortMode;
      if (isSortMode) {
        title.innerText = "📊 2단계: 최종 가성비 순위 결과";
        btn.innerHTML = "🔄 힌트/가격 다시 수정하기";
        btn.className = "w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-xl shadow-lg flex justify-center items-center gap-2 text-xs transition-all";
      } else {
        title.innerText = "🛠️ 1단계: 힌트 및 pt 사전 세팅";
        btn.innerHTML = "📊 최종 가성비 순위 정렬하기";
        btn.className = "w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded-xl shadow-lg flex justify-center items-center gap-2 text-xs transition-all";
      }
      processCalculation();
    }

    function toggleMasinSort() {
      isMasinSortMode = !isMasinSortMode;
      const btn = document.getElementById('btn-masin-sort');
      const label = document.getElementById('btn-masin-sort-label');
      if (isMasinSortMode) {
        btn.className = "bg-violet-600 hover:bg-violet-700 border border-violet-500 text-white font-bold py-2 px-2 rounded-xl shadow-sm flex flex-col justify-center items-center text-[10px] transition-all";
        label.textContent = "🔢 원래 순서로 되돌리기";
      } else {
        btn.className = "bg-violet-50 hover:bg-violet-100 border border-violet-300 text-violet-700 font-bold py-2 px-2 rounded-xl shadow-sm flex flex-col justify-center items-center text-[10px] transition-all";
        label.textContent = "🔢 마신 이득 순서로 정렬";
      }
      renderPage1();
    }

    function updateTotalMasinGain(value = null) {
      const el = document.getElementById('text-total-masin');
      if (!el) return;

      if (value === null || !Number.isFinite(Number(value))) {
        el.innerText = '-';
        return;
      }

      el.innerText = `${Number(value).toFixed(2)}`;
    }

    function getLivePtOfSkill(skill) {
      return getDiscountedPt(skill.base_pt, skill.hint_level);
    }

    function getChainParentNames(skill, idList = []) {
      const lowerIds = getLowerSkillChain(skill, [], []);
      lowerIds.forEach(id => {
        if (!idList.includes(id)) idList.push(id);
      });
      return idList;
    }

    function getChainTotalPt(skill, visited = []) {
      let currentPt = getLivePtOfSkill(skill);
      const currentId = String(skill.skill_id);

      if (visited.includes(currentId)) return currentPt;
      visited.push(currentId);

      const lowerSkill = getLowerSkill(skill);
      if (lowerSkill) {
        return currentPt + getChainTotalPt(lowerSkill, [...visited]);
      }

      return currentPt;
    }

    // 실제로 사용자가 선택한 스킬만 합산합니다.
    // 관계 DB가 상/하위 관계를 양방향으로 가지고 있을 수 있기 때문에
    // getChainTotalPt()를 그대로 사용하면 선택하지 않은 관계 스킬까지
    // 비용에 끼어들 수 있습니다. 예: 90 + 110을 선택했는데 250이 되는 경우.
    function getSelectedChainTotalPt(skill, selectedSkills, visited = []) {
      if (!skill) return 0;

      const currentId = String(skill.skill_id);
      if (visited.includes(currentId)) return 0;
      visited.push(currentId);

      const isSelected = selectedSkills.some(
        s => String(s.skill_id) === currentId
      );

      // 현재 스킬이 선택되지 않았다면 비용을 더하지 않습니다.
      let total = isSelected ? getLivePtOfSkill(skill) : 0;

      const lowerSkill = getLowerSkill(skill);
      if (lowerSkill) {
        const lowerId = String(lowerSkill.skill_id);
        const lowerSelected = selectedSkills.some(
          s => String(s.skill_id) === lowerId
        );

        // 하위 스킬이 실제 선택된 경우에만 합산합니다.
        if (lowerSelected) {
          total += getSelectedChainTotalPt(
            lowerSkill,
            selectedSkills,
            [...visited]
          );
        }
      }

      return total;
    }

    function getVirtualChainTotalPt(skill, targetHintLevel, visited = []) {
      let currentPt = getDiscountedPt(skill.base_pt, targetHintLevel);
      const currentId = String(skill.skill_id);

      if (visited.includes(currentId)) return currentPt;
      visited.push(currentId);

      const lowerSkill = getLowerSkill(skill);
      if (lowerSkill) {
        return currentPt + getVirtualChainTotalPt(
          lowerSkill,
          targetHintLevel,
          [...visited]
        );
      }

      return currentPt;
    }

    function processCalculation() {
      const container = document.getElementById('calculation-container');
      try {
        if (!container) return;
        container.innerHTML = '';

        const selectedSkills = appSkills.filter(s => s.selected);
        if (selectedSkills.length === 0) {
          container.innerHTML = `<div class="text-center text-gray-400 py-16 text-xs">선택된 스킬이 없습니다.</div>`;
          updateTotalMasinGain(null);
          return;
        }

        // ==========================================
        // 2단계: 힌트/pt 설정
        // ==========================================
        // 여기서는 절대로 스킬을 합치지 않습니다.
        // 사용자가 선택한 각각의 스킬에 독립적으로 힌트 Lv을 설정할 수 있어야 합니다.
        // 스킬 합치기는 2단계(최종 추천/가성비 정렬)에서만 수행합니다.
        if (!isSortMode) {
          let userSpPool = parseInt(document.getElementById('input-user-sp').value) || 0;

          selectedSkills.forEach((skill, index) => {
            const calculatedPt = getLivePtOfSkill(skill);
            const isAffordable = userSpPool >= calculatedPt;
            if (isAffordable) userSpPool -= calculatedPt;

            const efficiency = calculatedPt > 0
              ? ((Number(skill.masin) || 0) / calculatedPt) * 100
              : 0;

            const resultCard = document.createElement('div');
            resultCard.className = `p-3 rounded-xl bg-gray-800 text-xs text-white mb-2 border ${isAffordable ? 'border-green-500' : 'border-red-500/50 opacity-60'}`;
            resultCard.innerHTML = `
              <div class="flex justify-between items-center">
                <div class="min-w-0 flex-1 pr-2">
                  <div class="flex items-center gap-1 flex-wrap">
                    <span class="text-[9px] bg-gray-700 text-gray-400 px-1 py-0.2 rounded font-black shrink-0">세팅중</span>
                    <h4 class="font-bold text-gray-100 text-xs truncate">${escapeHtml(skill.name)}</h4>
                    <span class="text-[8px] bg-blue-500/30 text-blue-200 px-1 rounded">${escapeHtml(getDisplayRarity(skill.rarity))}</span>
                  </div>
                  <p class="text-[10px] text-gray-400 mt-0.5">
                    📊 가성비 효율: <span class="text-yellow-400 font-extrabold text-sm">${efficiency.toFixed(2)}</span>
                    <span class="text-[9px] text-gray-500">(비용: ${calculatedPt}pt / 마신: ${(Number(skill.masin) || 0).toFixed(2)})</span>
                  </p>
                  <p class="text-[10px] text-gray-300 bg-gray-950/40 px-1.5 py-1 rounded mt-1.5 border border-gray-700/30 font-medium whitespace-normal break-all leading-relaxed">
                    📋 조건: ${escapeHtml(skill.condition)}
                  </p>
                </div>
                <div class="text-green-400 font-black text-sm whitespace-nowrap border border-gray-700 rounded-lg px-2 py-1">${calculatedPt} pt</div>
              </div>

              <div class="mt-2 pt-1.5 border-t border-gray-700/60 flex justify-between items-center text-[11px]">
                <span class="text-gray-400 text-[10px]">인게임 힌트 등급 (스킬별 독립 할인)</span>
                <div class="flex items-center bg-gray-700 rounded p-0.5">
                  <button data-skill-id="${skill.skill_id}" data-amount="-1" class="hint-btn w-5 h-5 flex items-center justify-center rounded bg-gray-600 font-bold text-white text-xs">-</button>
                  <span class="w-10 text-center font-black text-gray-200 text-xs">Lv.${skill.hint_level}</span>
                  <button data-skill-id="${skill.skill_id}" data-amount="1" class="hint-btn w-5 h-5 flex items-center justify-center rounded bg-gray-600 font-bold text-white text-xs">+</button>
                </div>
              </div>
            `;
            container.appendChild(resultCard);
          });

          const remain = document.getElementById('text-remaining-sp');
          if (remain) remain.innerText = `${userSpPool} pt`;
          updateTotalMasinGain(null);
          return;
        }

        // ==========================================
        // 3단계: 최종 추천/가성비 계산
        // ==========================================
        // 관계가 있는 스킬을 동시에 선택하더라도 각각 독립적으로 계산합니다.
        // 예: R + SR을 둘 다 선택하면 R과 SR을 하나로 합치지 않고 각각 추천값을 계산합니다.
        // SR은 항상 "SR 원본 마신 - 하위 R 원본 마신" / "SR 실제 소모 PT"로 계산합니다.
        const groups = selectedSkills.map(skill => ({
          representative: skill,
          members: [skill],
          source: skill
        }));

        let calculationList = groups.map(group => {
          const displaySkill = group.representative || group.source;
          const selectedMembers = group.members;
          const representativeIsSelected = selectedMembers.some(
            s => String(s.skill_id) === String(displaySkill.skill_id)
          );

          // 모든 선택 스킬은 개별 계산합니다.
          // 특히 SR은 하위 R의 PT를 합산하지 않고 SR 자신의 할인 후 PT만 사용합니다.
          const selected = selectedMembers[0];
          const finalCostPt = getLivePtOfSkill(selected);
          const efficiencyDenominator = finalCostPt;
          const isCombined = false;

          // 마신/조건은 실제 선택된 스킬을 우선합니다.
          // 대표 스킬이 실제 선택되어 있으면 대표 스킬의 값을 사용합니다.
          const effectiveSource = representativeIsSelected
            ? displaySkill
            : selectedMembers[0];

          // 신규 SR 추천 로직: 마신은 DB 원본값만 사용합니다.
          // SR 단독 선택: (SR 원본 마신 - 하위 R 원본 마신) / SR 실제 PT
          // 현재 DB의 SR PT에는 하위 R PT가 포함되어 있지 않으므로 R PT를 차감하지 않습니다.
          let displayMasin = Number(effectiveSource.masin) || 0;
          let masinLabel = '마신';
          let isSrIncremental = false;

          // 상위 스킬의 마신은 "새로 추가되는 마신"으로 계산합니다.
          // R -> 하위 R이 있으면 하위 R의 원본 마신을 차감합니다.
          // SR -> 관계된 하위 R을 전부 차감합니다.
          // 예: R+R 구조에서 상위 R 선택
          //   상위 R 원본 마신 - 하위 R 원본 마신
          // 예: R+R+SR 구조에서 SR 선택
          //   SR 원본 마신 - R1 원본 마신 - R2 원본 마신
          const rarityRank = getRarityRank(effectiveSource);

          if (!isCombined && (rarityRank === 1 || rarityRank === 2)) {
            const lowerSkills = getLowerSkills(effectiveSource);
            const lowerRSkills = lowerSkills.filter(
              skill => getRarityRank(skill) === 1
            );

            // 마신의 "추가분"은 관계 단계에 따라 차감 대상을 다르게 봅니다.
            //
            // R + R:
            //   상위 R = 상위 R 원본 마신 - 바로 아래 R 원본 마신
            //
            // SR + R + R:
            //   SR = SR 원본 마신 - 상위 R 원본 마신
            //   (하위 R까지 다시 빼면 하위 R의 마신이 중복 차감됩니다.)
            //
            // 따라서 SR은 직접 연결된 R이 여러 개일 때 기본 PT가 가장 높은 R,
            // 즉 R 계층에서 "상위 R"인 하나만 차감합니다.
            let deductionRSkills = lowerRSkills;
            if (rarityRank === 2 && lowerRSkills.length > 0) {
              deductionRSkills = [
                [...lowerRSkills].sort((a, b) => {
                  const ptDiff = getSkillBasePt(b) - getSkillBasePt(a);
                  if (ptDiff !== 0) return ptDiff;
                  return String(b.skill_id).localeCompare(String(a.skill_id));
                })[0]
              ];
            }

            const lowerMasinTotal = deductionRSkills.reduce(
              (sum, skill) => sum + (Number(skill.masin) || 0),
              0
            );

            displayMasin = Math.max(0, displayMasin - lowerMasinTotal);

            if (deductionRSkills.length > 0) {
              const lowerNames = deductionRSkills
                .map(skill =>
                  `${skill.name || skill.skill_name_ko || 'R'} ${Number(skill.masin || 0).toFixed(2)}`
                )
                .join(' + ');

              if (rarityRank === 2) {
                masinLabel =
                  `추가 마신 (SR 원본 ${Number(effectiveSource.masin || 0).toFixed(2)} - 상위 R ${lowerNames})`;
                isSrIncremental = true;
              } else {
                masinLabel =
                  `추가 마신 (R 원본 ${Number(effectiveSource.masin || 0).toFixed(2)} - ${lowerNames})`;
              }
            } else if (rarityRank === 2) {
              masinLabel = '추가 마신 (상위 R 관계 없음)';
              isSrIncremental = true;
            }
          }

          const efficiency = efficiencyDenominator > 0
            ? ((displayMasin / efficiencyDenominator) * 100)
            : 0;

          return {
            ...displaySkill,
            masin: displayMasin,
            raw_masin: Number(effectiveSource.masin) || 0,
            condition: effectiveSource.condition,
            calculated_pt: finalCostPt,
            efficiency_pt: efficiencyDenominator,
            efficiency,
            masinLabel,
            isSrIncremental,
            isCombined,
            selectedMembers
          };
        });

        if (isSortMode) {
          calculationList.sort((a, b) => b.efficiency - a.efficiency);

          // ------------------------------------------
          // 필수 하위 스킬 체인 예산 검사
          // ------------------------------------------
          // 상위 스킬은 자기 자신만 살 수 있는 것이 아닙니다.
          // 예: 양호한 경기장귀신(SR)을 찍으려면
          //   양호한 경기장○(R) + 양호한 경기장◎(R) + 귀신(SR)
          // 을 모두 찍을 수 있어야 합니다.
          //
          // 따라서 상위 스킬의 가성비가 아무리 높아도
          // 전체 필수 체인을 현재 SP로 확보할 수 없다면 추천 대상에서 제외합니다.
          // R+R 상위 R, R+R+SR 모두 동일하게 처리합니다.
          const selectedById = new Map(
            selectedSkills.map(s => [String(s.skill_id), s])
          );

          const getPrerequisiteSkills = (skill) => {
            const lowerSkills = getAllLowerSkillChain(skill, [], []);
            return [skill, ...lowerSkills.filter(lower =>
              String(lower.skill_id) !== String(skill.skill_id)
            )];
          };

          calculationList.forEach(skill => {
            const source = skill.selectedMembers?.[0] || skill;
            const prerequisites = getPrerequisiteSkills(source);

            // SR만 선택한 경우에는 하위 R 스킬이 이미 습득되어 있다고 간주합니다.
            // 따라서 하위 R을 선택하지 않았더라도 SR을 추천 대상에서 제외하지 않습니다.
            // 단, 실제로 R을 선택한 경우에는 기존처럼 선택된 R 비용을 정상 반영합니다.
            const sourceRarityRank = getRarityRank(source);
            const isAssumedPrerequisite = (req) =>
              sourceRarityRank === 2 && getRarityRank(req) === 1;

            const missing = prerequisites.filter(req =>
              !selectedById.has(String(req.skill_id)) &&
              !isAssumedPrerequisite(req)
            );

            skill.prerequisiteSkills = prerequisites;
            skill.missingPrerequisites = missing;
            skill.assumedPrerequisites = prerequisites.filter(req =>
              !selectedById.has(String(req.skill_id)) &&
              isAssumedPrerequisite(req)
            );

            // 실제 선택한 스킬만 비용에 포함합니다.
            // SR 단독 선택 시 하위 R은 이미 찍힌 것으로 간주하므로 비용도 추가하지 않습니다.
            skill.prerequisiteCost = prerequisites.reduce((sum, req) => {
              const selectedReq = selectedById.get(String(req.skill_id));
              return sum + (selectedReq ? getLivePtOfSkill(selectedReq) : 0);
            }, 0);

            skill.prerequisiteComplete = missing.length === 0;
          });
        }

        let userSpPool = parseInt(document.getElementById('input-user-sp').value) || 0;

        // 이미 확보한 필수 체인은 다시 비용을 차감하지 않습니다.
        const committedSkillIds = new Set();

        calculationList.forEach((skill, index) => {
          let isAffordable = true;
          let isPrerequisiteBlocked = false;
          let requiredCost = skill.calculated_pt;

          if (isSortMode) {
            const prerequisites = skill.prerequisiteSkills || [skill];
            const missing = skill.missingPrerequisites || [];

            if (missing.length > 0) {
              isAffordable = false;
              isPrerequisiteBlocked = true;
            } else {
              const newRequiredSkills = prerequisites.filter(req =>
                !committedSkillIds.has(String(req.skill_id))
              );
              requiredCost = newRequiredSkills.reduce((sum, req) => {
                const selectedReq = selectedSkills.find(s =>
                  String(s.skill_id) === String(req.skill_id)
                );
                return sum + (selectedReq ? getLivePtOfSkill(selectedReq) : 0);
              }, 0);

              if (userSpPool >= requiredCost) {
                isAffordable = true;
                newRequiredSkills.forEach(req =>
                  committedSkillIds.add(String(req.skill_id))
                );
                userSpPool -= requiredCost;
              } else {
                isAffordable = false;
              }
            }
          } else {
            isAffordable = userSpPool >= skill.calculated_pt;
            if (isAffordable) userSpPool -= skill.calculated_pt;
          }

          skill.isAffordable = isAffordable;
          skill.isPrerequisiteBlocked = isPrerequisiteBlocked;
          skill.requiredCost = requiredCost;

          const resultCard = document.createElement('div');
          resultCard.className = `p-3 rounded-xl bg-gray-800 text-xs text-white mb-2 border ${isAffordable ? 'border-green-500' : 'border-red-500/50 opacity-60'}`;

          resultCard.innerHTML = `
            <div class="flex justify-between items-center">
              <div class="min-w-0 flex-1 pr-2">
                <div class="flex items-center gap-1 flex-wrap">
                  <span class="text-[9px] ${isSortMode ? (isAffordable ? 'bg-green-500' : 'bg-gray-600') : 'bg-gray-700 text-gray-400'} px-1 py-0.2 rounded font-black shrink-0">
                    ${isSortMode ? (isAffordable ? (index + 1) + '위' : '제외') : '세팅중'}
                  </span>
                  <h4 class="font-bold text-gray-100 text-xs truncate">${escapeHtml(skill.name)}</h4>
                  ${skill.isCombined ? '<span class="text-[8px] bg-blue-500/30 text-blue-200 px-1 rounded">노멀+레어</span>' : ''}
                </div>
                <p class="text-[10px] text-gray-400 mt-0.5">
                  📊 가성비 효율: <span class="text-yellow-400 font-extrabold text-sm">${skill.efficiency.toFixed(2)}</span>
                  <span class="text-[9px] text-gray-500">(비용: ${skill.efficiency_pt}pt / ${escapeHtml(skill.masinLabel || '마신')}: ${skill.masin.toFixed(2)})</span>
                </p>
                <p class="text-[10px] text-gray-300 bg-gray-950/40 px-1.5 py-1 rounded mt-1.5 border border-gray-700/30 font-medium whitespace-normal break-all leading-relaxed">
                  📋 조건: ${escapeHtml(skill.condition)}
                </p>
                ${isSortMode && skill.isPrerequisiteBlocked ? `
                  <p class="text-[10px] text-red-300 bg-red-950/30 px-1.5 py-1 rounded mt-1 border border-red-700/30 font-bold">
                    ⛔ 필수 하위 스킬 미선택: ${escapeHtml((skill.missingPrerequisites || []).map(s => s.name).join(', '))}
                  </p>
                ` : ''}
                ${isSortMode && !skill.isPrerequisiteBlocked && !skill.isAffordable && (skill.prerequisiteCost || 0) > 0 ? `
                  <p class="text-[10px] text-red-300 bg-red-950/30 px-1.5 py-1 rounded mt-1 border border-red-700/30 font-bold">
                    ⛔ 필수 체인 비용 부족: ${skill.prerequisiteCost}pt 필요
                  </p>
                ` : ''}
              </div>
              <div class="text-green-400 font-black text-sm whitespace-nowrap border border-gray-700 rounded-lg px-2 py-1">${skill.calculated_pt} pt</div>
            </div>

            <div class="mt-2 pt-1.5 border-t border-gray-700/60 flex justify-between items-center text-[11px] ${isSortMode ? 'hidden' : ''}">
              <span class="text-gray-400 text-[10px]">인게임 힌트 등급 (선택된 스킬별 독립 할인)</span>
              <div class="flex items-center bg-gray-700 rounded p-0.5">
                <button data-skill-id="${skill.selectedMembers?.[0]?.skill_id || skill.skill_id}" data-amount="-1" class="hint-btn w-5 h-5 flex items-center justify-center rounded bg-gray-600 font-bold text-white text-xs">-</button>
                <span class="w-10 text-center font-black text-gray-200 text-xs">Lv.${skill.selectedMembers?.[0]?.hint_level ?? skill.hint_level ?? 0}</span>
                <button data-skill-id="${skill.selectedMembers?.[0]?.skill_id || skill.skill_id}" data-amount="1" class="hint-btn w-5 h-5 flex items-center justify-center rounded bg-gray-600 font-bold text-white text-xs">+</button>
              </div>
            </div>
          `;
          container.appendChild(resultCard);
        });

        const remain = document.getElementById('text-remaining-sp');
        if (remain) remain.innerText = `${userSpPool} pt`;

        // 최종 추천 결과에서 실제로 추천 가능한(구매 가능한) 스킬들의
        // 표시 마신이득을 모두 합산합니다.
        if (isSortMode) {
          const totalMasinGain = calculationList.reduce((sum, skill) => {
            return sum + (
              skill.isAffordable && !skill.isPrerequisiteBlocked
                ? (Number(skill.masin) || 0)
                : 0
            );
          }, 0);
          updateTotalMasinGain(totalMasinGain);
        } else {
          updateTotalMasinGain(null);
        }
      } catch (error) {
        console.error('[CALC] 계산 오류:', error);
        // 계산 오류가 나도 선택 스킬 화면 자체는 사라지지 않도록 원본 선택 목록을 복구합니다.
        container.innerHTML = `<div class="text-center text-red-400 py-16 text-xs">계산 중 오류가 발생했습니다.<br><span class="text-gray-500">${escapeHtml(error.message)}</span></div>`;
      }
    }

    function adjustHint(skillId, amount) {
      const skill = appSkills.find(s => String(s.skill_id) === String(skillId));
      if (!skill) return;
      const nextLevel = skill.hint_level + amount;
      if (nextLevel >= 0 && nextLevel <= 5) {
        skill.hint_level = nextLevel;
        processCalculation();
      }
    }

    function openBottomSheet() {
      isSortMode = false; 
      document.getElementById('sheet-title').innerText = "🛠️ 1단계: 힌트 및 pt 사전 세팅";
      const btn = document.getElementById('btn-toggle-sort');
      btn.innerHTML = "📊 최종 가성비 순위 정렬하기";
      btn.className = "w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded-xl shadow-lg flex justify-center items-center gap-2 text-xs transition-all";
      document.getElementById('bottom-sheet').classList.remove('translate-y-full');

      // 이벤트 위임: hint-btn 클릭 처리 (스킬 이름에 특수문자가 있어도 안전)
      // processCalculation()이 호출될 때마다 innerHTML이 재생성되므로 컨테이너에 한 번만 등록
      const calcContainer = document.getElementById('calculation-container');
      if (!calcContainer._hintListenerAttached) {
        calcContainer.addEventListener('click', function(e) {
          const hintBtn = e.target.closest('.hint-btn');
          if (!hintBtn) return;
          const skillId = hintBtn.dataset.skillId;
          const amount = parseInt(hintBtn.dataset.amount);
          adjustHint(skillId, amount);
        });
        calcContainer._hintListenerAttached = true;
      }

      processCalculation();
    }
    
    function closeBottomSheet() {
      document.getElementById('bottom-sheet').classList.add('translate-y-full');
      renderPage1();
    }
  </script>
</body>
</html>
